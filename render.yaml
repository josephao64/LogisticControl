services:
  - type: web
    name: logistic-control
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

